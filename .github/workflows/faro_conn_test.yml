name: FARO Connection Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test FARO with stored token
        env:
          FARO_WEBHOOK_URL: ${{ secrets.FARO_WEBHOOK_URL }}
          FARO_API_TOKEN: ${{ secrets.FARO_API_TOKEN }}
        run: |
          echo "Token length: ${#FARO_API_TOKEN} (value hidden)"
          echo "Token prefix: $(printf '%s' "$FARO_API_TOKEN" | cut -c1-3)**"
          # Use the stored webhook URL as-is.
          FULL="$FARO_WEBHOOK_URL"
          if [[ "$FULL" != */create-signal && "$FARO_WEBHOOK_URL" =~ ^https:// ]]; then
            BASE=$(printf '%s' "$FARO_WEBHOOK_URL" | grep -oP '^https://[^/]+')
            FULL="${BASE}/functions/v1/create-signal"
            echo "Stored URL lacked /functions; used: $FULL"
          fi
          BODY=$(printf '{"action":"test","token":"%s","terminal_id":"jayu-equity-long-auditor"}' "$FARO_API_TOKEN")
          echo "=== Sending action:test to FARO ==="
          curl -s -o /tmp/faro_resp.txt -w "HTTP_STATUS=%{http_code}\n" \
            -X POST "$FULL" -H "Content-Type: application/json" -d "$BODY" \
            --max-time 15
          echo "FARO response (body):"
          cat /tmp/faro_resp.txt
          echo ""
