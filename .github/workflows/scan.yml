name: JAYU Equity Long Auditor

on:
  workflow_dispatch:
    inputs:
      force_symbol:
        description: "Símbolo único a escanear (p. ej. NVDA). Vacío = watchlist completa."
        required: false
        default: ""
      force_send:
        description: "Obliga el envío a FARO aunque el prefilter descarte (sigue validando LONG/audit/SL/TP). true/false"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "7 * * * *"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Scan market
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FARO_WEBHOOK_URL: ${{ secrets.FARO_WEBHOOK_URL }}
          FARO_API_TOKEN: ${{ secrets.FARO_API_TOKEN }}
          FARO_PROCESS_ID: ${{ vars.FARO_PROCESS_ID || 'jayu-equity-long-auditor' }}
          FARO_STRATEGY_ID: ${{ vars.FARO_STRATEGY_ID || 'equity-long-swing-d1' }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          AUDIT_ONLY: "true"
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          MIN_CONFIDENCE: ${{ vars.MIN_CONFIDENCE || '80' }}
          MAX_SIGNALS_PER_RUN: ${{ vars.MAX_SIGNALS_PER_RUN || '3' }}
          WATCHLIST: ${{ vars.WATCHLIST || 'AAPL,MSFT,NVDA,AMD,AVGO,META,GOOGL,AMZN,TSLA,PLTR,CRWD,NET,ORCL,SMCI' }}
          FORCE_SYMBOL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_symbol || '' }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send || 'false' }}
        run: python -m src.main

